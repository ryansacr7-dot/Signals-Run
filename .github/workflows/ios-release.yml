name: Build and Deploy iOS Game
on:
  push:
    branches:
      - main
      - master
jobs:
  deploy-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Build Folder
        run: |
          mkdir -p www
          cp index.html www/ || true
          cp -r assets www/ || true
          cp *.js www/ || true
          cp *.css www/ || true

      - name: Install Mobile Environment Wrapper
        run: |
          npm init -y || true
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/ios@5
          npx cap init "Signals Run" "com.ryan.signalrun" --web-dir=www --no-open || npx cap init "Signals Run" "com.ryan.signalrun" --web-dir=www
          npx cap add ios

      - name: Sync Web Game Assets into Native iOS
        run: |
          npx cap sync ios

      - name: Update Xcode Build Settings Configuration
        run: |
          XCODE_PROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "XL662VBNF4";/g' "$XCODE_PROJ"
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.ryan.signalrun;/g' "$XCODE_PROJ"

      - name: Build and Export App Bundle using Apple API Key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # Set up Apple API key inside the cloud runner session
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
          
          # Create automated configuration profile options
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>XL662VBNF4</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

          # Compile and Archive directly using cloud-based automatic authentication
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/SignalsRun.xcarchive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$API_KEY_ID" \
                     -authenticationKeyIssuer "$API_ISSUER_ID" \
                     -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8 \
                     archive

          # Export final package file
          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/SignalsRun.xcarchive \
                     -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
                     -exportPath $RUNNER_TEMP/build \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$API_KEY_ID" \
                     -authenticationKeyIssuer "$API_ISSUER_ID" \
                     -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8

      - name: Upload Binary Package straight to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f $RUNNER_TEMP/build/App.ipa -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
